<!DOCTYPE html><html lang="pt"><head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#000000">

<title>Oferta Especial</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

.app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    margin: 0 auto;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(255, 195, 0, 0.13),
            transparent 31%
        ),
        radial-gradient(
            circle at 50% 70%,
            rgba(255, 170, 0, 0.05),
            transparent 36%
        ),
        #000;
}

/* PARTÍCULAS */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffd21a;

    box-shadow: 0 0 10px #ffd21a;

    opacity: .55;

    animation: floatParticle 8s linear infinite;
}

.particle:nth-child(1) {
    left: 10%;
    top: 22%;
}

.particle:nth-child(2) {
    left: 79%;
    top: 15%;
    width: 6px;
    height: 6px;
}

.particle:nth-child(3) {
    left: 22%;
    top: 43%;
    width: 3px;
    height: 3px;
}

.particle:nth-child(4) {
    left: 90%;
    top: 34%;
}

.particle:nth-child(5) {
    left: 74%;
    top: 58%;
    width: 3px;
    height: 3px;
}

.particle:nth-child(6) {
    left: 12%;
    top: 70%;
    width: 3px;
    height: 3px;
}

.particle:nth-child(7) {
    left: 56%;
    top: 80%;
}

@keyframes floatParticle {
    0% {
        transform: translateY(0);
        opacity: .1;
    }

    50% {
        opacity: .7;
    }

    100% {
        transform: translateY(-50px);
        opacity: .05;
    }
}

/* CONTEÚDO */

.hero {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px 18px 145px;
}

/* SELO */

.badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 12px 23px;

    margin-bottom: 52px;

    border: 2px solid rgba(255, 207, 45, .45);
    border-radius: 50px;

    color: #ffd21a;

    font-size: 14px;
    font-weight: 900;

    letter-spacing: 3px;
    text-transform: uppercase;

    box-shadow:
        0 0 18px rgba(255, 200, 0, .06);
}

/* TÍTULO */

.title {
    width: 100%;
}

.title-main {
    display: block;

    color: #ffd21a;

    font-size: clamp(34px, 9.7vw, 56px);

    line-height: 1.08;

    font-weight: 1000;

    text-transform: uppercase;

    letter-spacing: -1px;

    text-shadow:
        0 0 6px rgba(255, 210, 26, .95),
        0 0 16px rgba(255, 190, 0, .48),
        0 0 35px rgba(255, 190, 0, .20);
}

.title-bottom {
    display: block;

    margin-top: 17px;

    color: #fff;

    font-size: clamp(25px, 7vw, 38px);

    line-height: 1.12;

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;
}

/* DESCRIÇÃO */

.description {
    width: 100%;
    max-width: 450px;

    margin-top: 52px;

    color: #c1c1c1;

    font-size: clamp(18px, 4.7vw, 22px);

    line-height: 1.55;

    font-weight: 400;
}

/* BOTÃO */

.cta {
    width: 100%;
    max-width: 470px;

    min-height: 108px;

    margin-top: 50px;

    padding: 20px;

    border: none;
    border-radius: 29px;

    background:
        linear-gradient(
            180deg,
            #ffe45c 0%,
            #ffd21a 45%,
            #ffb800 100%
        );

    color: #050505;

    font-family: Arial, Helvetica, sans-serif;

    font-size: clamp(19px, 5.1vw, 27px);

    font-weight: 1000;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    cursor: pointer;

    text-decoration: none;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    box-shadow:
        0 0 10px rgba(255, 210, 26, .55),
        0 0 28px rgba(255, 190, 0, .25),
        0 15px 40px rgba(0, 0, 0, .55);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.cta:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 15px rgba(255, 220, 50, .75),
        0 0 35px rgba(255, 190, 0, .35);
}

.cta:active {
    transform: scale(.96);
}

.arrow {
    display: inline-block;
    font-size: 34px;

    transition:
        transform .2s ease;
}

.cta:hover .arrow {
    transform: translateX(5px);
}

/* RESPONSABILIDADE */

.responsible {
    margin-top: 24px;

    color: #777;

    font-size: 14px;
}

/* NOTIFICAÇÃO */

.notification {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 50px;

    transform: translateX(-50%);

    width: calc(100% - 30px);
    max-width: 470px;

    min-height: 72px;

    display: flex;
    align-items: center;

    padding: 12px 17px;

    border: 1px solid rgba(255, 203, 25, .28);

    border-radius: 40px;

    background: rgba(9, 9, 9, .96);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, .75),
        0 0 20px rgba(255, 195, 0, .04);

    animation:
        notificationIn .5s ease;
}

.notification-dot {
    flex-shrink: 0;

    width: 17px;
    height: 17px;

    margin-right: 17px;

    border-radius: 50%;

    background: #ffd21a;

    box-shadow:
        0 0 12px rgba(255, 210, 26, .8);
}

.notification-text {
    color: #d0d0d0;

    font-size: clamp(13px, 3.7vw, 17px);

    font-weight: 700;

    line-height: 1.3;

    text-align: left;
}

.notification-name {
    color: #ffd21a;
    font-weight: 900;
}

.notification-highlight {
    color: #fff;
    font-weight: 900;
}

@keyframes notificationIn {
    from {
        opacity: 0;
        transform: translate(-50%, 30px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

@keyframes notificationOut {
    from {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    to {
        opacity: 0;
        transform: translate(-50%, 25px);
    }
}

/* TABLETS E COMPUTADORES */

@media (min-width: 768px) {

    .hero {
        max-width: 760px;
        margin: 0 auto;
        padding: 50px 30px 150px;
    }

    .badge {
        margin-bottom: 55px;
        font-size: 15px;
    }

    .title-main {
        font-size: 58px;
    }

    .title-bottom {
        font-size: 40px;
    }

    .description {
        max-width: 650px;
        font-size: 21px;
    }

    .cta {
        max-width: 500px;
        min-height: 105px;
    }
}

/* MOBILE */

@media (max-width: 480px) {

    .hero {
        padding: 28px 18px 140px;
    }

    .badge {
        margin-bottom: 45px;
        padding: 12px 19px;

        font-size: 12px;
        letter-spacing: 2.5px;
    }

    .title-main {
        font-size: 36px;
    }

    .title-bottom {
        font-size: 24px;
        letter-spacing: 1.5px;
    }

    .description {
        margin-top: 45px;
        font-size: 17px;
    }

    .cta {
        min-height: 103px;
        margin-top: 43px;

        border-radius: 27px;

        font-size: 19px;
    }

    .notification {
        bottom: 48px;
        width: calc(100% - 28px);
    }

    .notification-text {
        font-size: 13px;
    }
}

/* TELEFONES PEQUENOS */

@media (max-width: 360px) {

    .title-main {
        font-size: 31px;
    }

    .title-bottom {
        font-size: 20px;
    }

    .description {
        font-size: 16px;
    }

    .cta {
        min-height: 90px;
        font-size: 17px;
    }

    .notification-text {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- PARTÍCULAS -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="hero">

        <!-- SELO -->

        <div class="badge">
            ✦ &nbsp; OFERTA ESPECIAL
        </div>


        <!-- TÍTULO -->

        <h1 class="title">

            <span class="title-main">
                🎉 PARABÉNS! 🎉 VOCÊ GANHOU 5000 MZN
            </span>

            <span class="title-bottom">
                
            </span>

        </h1>


        <!-- DESCRIÇÃO -->

        <p class="description">
            CRIE SUA CONTA AGORA E COMECE A JOGAR  E FAZ UM DEPOSITO DE NO MINIMO 120MT OU 200MT NO SEU PRIMEIRO DEPOSITO.
        </p>


        <!--
            REDIRECIONAMENTO DIRETO

            Ao clicar, o navegador abre imediatamente
            o endereço definido no href.

            Não depende de JavaScript.
            Não possui contagem regressiva.
            Não existe página intermediária.
        -->

        <a href="https://go.aff.nicebetpartners.com/bvjy0dcq" class="cta">

            REGISTAR-SE AGORA

            <span class="arrow">
                →
            </span>

        </a>


        <!-- RESPONSABILIDADE -->

        <div class="responsible">
            +18 · Jogue com responsabilidade
        </div>

    </main>


    <!-- NOTIFICAÇÃO -->

    <div class="notification" id="notification">

        <span class="notification-dot"></span>

        <div class="notification-text">

            <span class="notification-name" id="userName">
                Carlos
            </span>

            <span>
                acabou de verificar a
            </span>

            <span class="notification-highlight">
                oferta disponível.
            </span>

        </div>

    </div>

</div>


<script>

/* ==========================================
   NOTIFICAÇÕES AUTOMÁTICAS
========================================== */

const names = [
    "Carlos",
    "Arnaldo",
    "Edson",
    "Ana",
    "Ricardo",
    "Mateus",
    "Paulo"
];

let notificationIndex = 0;


function changeNotification() {

    const notification =
        document.getElementById("notification");

    const userName =
        document.getElementById("userName");


    notification.style.animation =
        "notificationOut .35s ease forwards";


    setTimeout(function () {

        notificationIndex++;


        if (
            notificationIndex >= names.length
        ) {
            notificationIndex = 0;
        }


        userName.textContent =
            names[notificationIndex];


        notification.style.animation =
            "notificationIn .5s ease forwards";

    }, 350);
}


/* Alteração automática das notificações */

setInterval(
    changeNotification,
    4500
);

</script>


</body></html>
