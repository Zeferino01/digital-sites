<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐⭐⭐⭐⭐ 4/5✅ Aviator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      width: 90%;
      max-width: 380px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      padding-bottom: 25px;
    }
    .image-box {
      width: 100%;
      background: #000;
      line-height: 0;
    }
    .image-box img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
    }
    .content {
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      color: #1c1e21;
      margin: 0 0 10px 0;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      color: #65676b;
      line-height: 1.4;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 12px 40px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 18px;
      transition: background 0.3s;
      box-shadow: 0 4px 10px rgba(0,123,255,0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .timer-box {
      margin-top: 25px;
    }
    #timer {
      font-size: 40px;
      font-weight: 700;
      color: #adb5bd;
      display: block;
      line-height: 1;
    }
    .timer-label {
      font-size: 14px;
      color: #adb5bd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
